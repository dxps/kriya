<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kriya · Component workshop</title>
<style>@font-face{font-family:Work Sans;src:url('/fonts/WorkSans.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#11171c;color:#dbe3e8;font-family:Work Sans,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#status{position:fixed;bottom:12px;right:16px;font-size:12px;color:#92a5b0}#errors{display:none;position:fixed;inset:20px;padding:24px;background:#281c24;white-space:pre-wrap;overflow:auto}</style></head>
<body><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><div id="status">Starting Odin + Sokol…</div><pre id="errors"></pre>
<script>
var Module={canvas:document.getElementById('canvas'),print:console.log,printErr:console.error,onRuntimeInitialized(){Module.ccall('kriya_start',null,[],[]);document.getElementById('status').textContent='Odin + Sokol / WebGL2 · Live reload connected'}};
let revision=null;setInterval(async()=>{try{const r=await fetch('/__dev',{cache:'no-store'});const s=await r.json();if(revision!==null&&revision!==s.revision)location.reload();revision=s.revision;const e=document.getElementById('errors');e.style.display=s.error?'block':'none';e.textContent=s.error?'Build failed — check the terminal for compiler diagnostics. The previous build is still running.':''}catch{}},700);
Module.instantiateWasm=function(imports,receive){imports.odin_env=imports.env;WebAssembly.instantiateStreaming(fetch('/app.wasm'),imports).then(result=>receive(result.instance,result.module)).catch(console.error);return {}};
</script><script src="/app.js"></script></body></html>
