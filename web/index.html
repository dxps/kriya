<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kriya · Component workshop</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=2">
<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2">
<style>@font-face{font-family:Work Sans;src:url('/fonts/WorkSans.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#11171c;color:#dbe3e8;font-family:Work Sans,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#status{position:fixed;bottom:12px;right:16px;font-size:12px;color:#92a5b0}#errors{display:none;position:fixed;inset:20px;padding:24px;background:#281c24;white-space:pre-wrap;overflow:auto}</style></head>
<body><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><div id="status">Starting Odin + Sokol…</div><pre id="errors"></pre>
<script>
let ready=false;
var Module={canvas:document.getElementById('canvas'),print:console.log,printErr:console.error,onRuntimeInitialized(){Module.ccall('kriya_start',null,[],[]);ready=true}};
window.addEventListener('popstate',()=>{if(ready)Module.ccall('kriya_route_changed',null,[],[])});
let revision=null;
const events=new EventSource('/__events');
events.addEventListener('build',event=>{
  const state=JSON.parse(event.data);
  const next=state.server+':'+state.revision;
  if(revision!==null&&revision!==next){location.reload();return}
  revision=next;
  const errors=document.getElementById('errors');
  errors.style.display=state.error&&!state.building?'block':'none';
  errors.textContent=state.error?'Build failed — check the terminal for compiler diagnostics. The previous build is still running.':'';
  document.getElementById('status').textContent=state.building?'Rebuilding…':state.error?'Build failed':'Odin + Sokol / WebGL2 · SSE connected';
});
events.onerror=()=>{document.getElementById('status').textContent='Live reload disconnected · Reconnecting…'};
Module.instantiateWasm=function(imports,receive){imports.odin_env=imports.env;WebAssembly.instantiateStreaming(fetch('/app.wasm'),imports).then(result=>receive(result.instance,result.module)).catch(console.error);return {}};
</script><script src="/app.js"></script></body></html>
